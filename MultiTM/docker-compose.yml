services:
    web:
        build: .
        command: daphne -b 0.0.0.0 -p 8000 core.asgi:application
        restart: unless-stopped
        volumes:
            - .:/app
        ports:
            - "8000:8000"
        depends_on:
            - db
            - redis
            - ministack
        env_file:
            - .env

    celery:
        build: .
        command: celery -A core worker -l info
        restart: unless-stopped
        volumes:
            - .:/app
        depends_on:
            - db
            - redis
        env_file:
            - .env

    db:
        image: postgres:16-alpine
        environment:
            - POSTGRES_DB=${DB_NAME}
            - POSTGRES_USER=${DB_USER}
            - POSTGRES_PASSWORD=${DB_PASSWORD}
        ports:
            - "5433:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"

    ministack:
        image: ministackorg/ministack
        ports:
            - "4566:4566"
        environment:
            - MINISTACK_REGION=us-east-1
            - PERSIST_STATE=1
            - PERSISTENCE=1
            - STATE_DIR=/var/lib/ministack
        volumes:
            - ministack_data:/var/lib/ministack

volumes:
    postgres_data:
    ministack_data:
